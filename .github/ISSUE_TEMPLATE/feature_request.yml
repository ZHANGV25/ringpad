name: Feature request
description: Something Ringpad should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation, not the solution. "In Valorant I want to..." works well.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: textarea
    id: today
    attributes:
      label: What you do today instead
