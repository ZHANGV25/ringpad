name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tauri::generate_context! needs the built UI at compile time.
      - run: npm run build --workspace ui
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  ui:
    name: UI (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace ui
      - run: npm run coverage --workspace ui
      - run: npm run build --workspace ui
      # End-to-end against the fake engine, light and dark (ui/playwright.config.ts starts Vite).
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npm run e2e --workspace ui
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 7

  site:
    name: Site (typecheck, test, build, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # The build writes next-env.d.ts, which the typecheck needs.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run coverage
      # Both widths, an AA check and the phone menu (site/playwright.config.ts starts next dev).
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-playwright-report
          path: |
            site/playwright-report
            site/test-results
          retention-days: 7
